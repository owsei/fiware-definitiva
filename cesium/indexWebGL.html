<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebGL Demo</title>

  <!--LIBRERIA TRASFORMACION GEOLOCALIZACION-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"></script>

  <!--CESIUM-->
  <script src="https://unpkg.com/cesium@latest/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.129/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  
  <!--BOOTSTRAP-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <script src="js/createElementsGEO.js"></script>
  <link rel="stylesheet" href="styles/styles.css"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js" integrity="sha512-zhHQR0/H5SEBL3Wn6yYSaTTZej12z0hVZKOv3TwCUXT1z5qeqGcXJLLrbERYRScEDDpYIJhPC1fk31gqR783iQ==" crossorigin="anonymous" defer></script>
  
</head>
<body >
    <h2>Prueba de canvas</h2>
  
    <canvas id="glcanvas" width="640" height="480">
        Tu navegador parece no soportar el elemento HTML5
        <code>&lt;canvas&gt;</code>.
    </canvas>
    <script type="module">
        var gl; // Un variable global para el contexto WebGL
        function initWebGL(canvas) {
            gl = null;

            try {
                // Tratar de tomar el contexto estandar. Si falla, retornar al experimental.
                gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
            } catch (e) {}

            // Si no tenemos ningun contexto GL, date por vencido ahora
            if (!gl) {
                alert("Imposible inicializar WebGL. Tu navegador puede no soportarlo.");
                gl = null;
            }

            return gl;
        }
        function start() {
            var canvas = document.getElementById("glcanvas");

            gl = initWebGL(canvas); // Inicializar el contexto GL

            // Solo continuar si WebGL esta disponible y trabajando
            if (gl) {
                gl.clearColor(0.0, 0.0, 0.0, 1.0); // Establecer el color base en negro, totalmente opaco
                gl.enable(gl.DEPTH_TEST); // Habilitar prueba de profundidad
                gl.depthFunc(gl.LEQUAL); // Objetos cercanos opacan objetos lejanos
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); // Limpiar el buffer de color asi como el de profundidad
            }
        }
        
        start();
    </script>
</body>
</html>
